[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotto-ml"
version = "2.0.0"
description = "주 5,000원 한국 로또 추천 시스템 (covering design + weak ML prior)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas>=2.2.0",
    "playwright>=1.49.0",
    "pyarrow>=22.0.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.5.0",
    "ortools>=9.10",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-snapshot>=0.9",
    "hypothesis>=6.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
lotto = "lottoml.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["lottoml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
